name: Actualizacion Automatica OVP

on:
  schedule:
    - cron: '0 6 * * *' # Ejecuta automáticamente todos los días a las 06:00 UTC
  workflow_dispatch: # Permite la ejecución manual desde la interfaz web de GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-latest # Entorno liviano con GDAL, OGR y Python preinstalados

    permissions:
      contents: write # Permite al flujo hacer git push de los cambios al repositorio

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar script de actualización
        run: python main.py

      - name: Guardar y publicar archivos actualizados (.ics y .kml)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Actualización automática de ICS y KML" || exit 0
          git push
